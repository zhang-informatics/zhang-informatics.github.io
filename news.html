<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="news.css" />
</head>
<body>
<div id="container">
  <!-- Sidebar -->
  <div id="sidebar">
    <img src="assets/rui_zhang.png" alt="Dr. Rui Zhang" class="profile-pic" />
    <h2>Rui Zhang</h2>
    <h3>PhD, FACMI, FAMIA, FIAHSI</h3>
    <h3>Professor and Founding Chief</h3>
    <h4>Division of Computational Health Sciences </h4>
    <h4>Department of Surgery</h4>
    <h3>University of Minnesota</h3>
    <p>Email: <a href="mailto:ruizhang@umn.edu">ruizhang[AT]umn[dot]edu</a></p>
    <div class="nav">
      <a href="index.html" class="active">Home</a>
      <a href="news.html">News</a>
      <a href="grants.html">Grants</a>
      <a href="publications.html">Publications</a>
      <a href="people.html">People</a>
    </div>
  </div>

  <!-- Main Content -->
  <div id="main-content">
    <h1>Lab News</h1>
    <div id="news-list" class="news-list"></div>
  </div>
</div>

<script>
  fetch("data/news.json")
          .then(response => response.json())
          .then(data => {
            const container = document.getElementById("news-list");
            data.forEach(item => {
              const div = document.createElement("div");
              div.className = "news-item";
              div.innerHTML = `
            <h3>${item.title}</h3>
            <p class="news-date">${item.date}</p>
            <p>${item.content || ""}</p>
          `;
              container.appendChild(div);
            });
          });
</script>
</body>
</html>
